    - data:
        code: |-
          import json

          def main(run_result: str) -> dict:
              try:
                  data = json.loads(run_result or "{}")
              except (TypeError, json.JSONDecodeError):
                  return {"text": "采集结果无法解析，请检查上一步输出。"}

              status = data.get("workflowStatus", "unknown")
              total = data.get("totalNoticesCollected", 0)
              plans = data.get("plansExecuted", 0)
              skipped = data.get("skippedCount", 0)
              lines = [
                  "招标采集运行摘要",
                  f"运行状态：{status}",
                  f"执行计划：{plans} 个",
                  f"采集公告：{total} 条",
                  f"跳过计划：{skipped} 个",
              ]
              failed = [p for p in data.get("plans", []) if p.get("error")]
              if failed:
                  lines.append("错误计划：" + ", ".join(
                      f"{p.get('planId', 'unknown')} ({p.get('error')})" for p in failed))
              if status == "skipped":
                  lines.append("说明：计划今天已经执行过，本次未重复推送。")
              elif status == "success":
                  lines.append("下一步：可查看采集台账或等待下一次定时执行。")
              else:
                  lines.append("下一步：检查上一步 API 响应和服务日志。")
              return {"text": "\n".join(lines)}
        code_language: python3
        desc: 基于采集结果生成确定性运行摘要，不依赖外部 LLM 凭据
