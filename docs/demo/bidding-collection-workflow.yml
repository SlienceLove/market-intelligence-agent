    - data:
        code: |-
          import datetime
          import json

          def main(plan_ids_text: str, as_of: str) -> dict:
              payload = {}
              plan_ids = [item.strip() for item in (plan_ids_text or "").split(",") if item.strip()]
              if plan_ids:
                  payload["planIds"] = plan_ids

              normalized_as_of = (as_of or "").strip()
              if normalized_as_of:
                  try:
                      datetime.date.fromisoformat(normalized_as_of)
                  except ValueError as exc:
                      raise ValueError("执行日期必须使用 yyyy-MM-dd 格式") from exc
                  payload["asOf"] = normalized_as_of

              return {"request_body": json.dumps(payload, ensure_ascii=False)}
