    - data:
        code: |-
          import json

          def main(response: str, http_status: int) -> dict:
              try:
                  status_code = int(http_status or 0)
              except (TypeError, ValueError):
                  status_code = 0

              try:
                  data = json.loads(response or "{}")
              except (TypeError, json.JSONDecodeError):
                  return _result("error", status_code, "API 返回了无法解析的 JSON", [])

              if status_code < 200 or status_code >= 300:
                  detail = data.get("detail") or data.get("title") or "请求失败"
                  return _result("error", status_code, f"HTTP {status_code}: {detail}", [])

              plans = data.get("plans")
              if not isinstance(plans, list):
                  return _result("error", status_code, "API 响应缺少 plans 数组", [])

              plans_executed = _as_int(data.get("plansExecuted"))
              total_notices = _as_int(data.get("totalNoticesCollected"))
              skipped_count = _as_int(data.get("skippedCount"))
              api_status = str(data.get("status") or "unknown").lower()
              workflow_status = api_status
              if api_status == "success" and plans_executed > 0 and skipped_count == plans_executed:
                  workflow_status = "skipped"
              elif api_status not in {"success", "partial"}:
                  workflow_status = "error"

              normalized_plans = []
              for plan in plans:
                  if not isinstance(plan, dict):
                      continue
                  normalized_plans.append({
                      "planId": str(plan.get("planId") or "unknown"),
                      "noticesCollected": _as_int(plan.get("noticesCollected")),
                      "outcome": str(plan.get("outcome") or "unknown"),
                      "error": plan.get("error"),
                  })

              payload = {
                  "workflowStatus": workflow_status,
                  "apiStatus": api_status,
                  "httpStatus": status_code,
                  "plansExecuted": plans_executed,
                  "totalNoticesCollected": total_notices,
                  "skippedCount": skipped_count,
                  "plans": normalized_plans,
              }
              return {"result": json.dumps(payload, ensure_ascii=False)}

          def _as_int(value) -> int:
              try:
                  return max(0, int(value or 0))
              except (TypeError, ValueError):
                  return 0

          def _result(status: str, http_status: int, message: str, plans: list) -> dict:
              return {"result": json.dumps({
                  "workflowStatus": status,
                  "httpStatus": http_status,
                  "message": message,
                  "plans": plans,
              }, ensure_ascii=False)}
